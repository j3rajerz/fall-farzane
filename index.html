<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>فال فرزانه — هر کارت، روایتی برای اندیشیدن</title>
<meta name="description" content="فال فرزانه، تجربه‌ای شخصی‌سازی‌شده و کیهانی از تاروت فارسی بر پایهٔ تاریخ تولد شمسی." />
<meta name="theme-color" content="#0a0d1f" />
<link rel="manifest" href="manifest.json" />
<link rel="preload" as="image" href="assets/backgrounds/tarot-reader.webp" fetchpriority="low" />

<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/cosmic.css" />
<link rel="stylesheet" href="css/cards.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/kabbalah.css" />
</head>
<body>

<!-- بکگراند تصویری ثابت (بدون جاوااسکریپت، بدون انیمیشن) — بخاطر کارایی، فقط یک لایهٔ CSS ساده -->
<div id="app-bg-image" aria-hidden="true"></div>

<div id="cosmic-bg" aria-hidden="true">
  <canvas id="cosmic-canvas"></canvas>
  <div class="cosmic-nebula n1"></div>
  <div class="cosmic-nebula n2"></div>
  <div class="cosmic-sun-glow"></div>
  <div class="cosmic-moon"></div>
  <div class="cosmic-orbits">
    <div class="orbit-ring r1"><div class="orbit-planet"></div></div>
    <div class="orbit-ring r2"><div class="orbit-planet"></div></div>
    <div class="orbit-ring r3"><div class="orbit-planet"></div></div>
  </div>
</div>

<div id="app-shell">
  <main id="view-root" role="main" aria-live="polite"></main>
  <nav id="bottom-nav" aria-label="ناوبری اصلی"></nav>
</div>

<!-- دادهٔ کارت‌ها -->
<script src="data/cards.js"></script>
<script src="data/kabbalah-data.js"></script>

<!-- موتورها -->
<script src="js/jalali-date.js"></script>
<script src="js/tarot-engine.js"></script>
<script src="js/personalization-engine.js"></script>
<script src="js/storage.js"></script>
<script src="js/readings.js"></script>
<script src="js/kabbalah.js"></script>
<script src="js/palm-engine.js"></script>

<!-- رابط کاربری و برنامه -->
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        /* عدم موفقیت در ثبت service worker نباید برنامه را مختل کند */
      });
    });
  }
</script>
</body>
</html>
